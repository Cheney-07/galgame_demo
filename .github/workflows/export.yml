name: Export & Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.1"
  EXPORT_DIR: build

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config
          cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/ || true
          cp -r /root/.config/godot ~/.config/ || true

      - name: Create export directories
        run: |
          mkdir -p ${{ env.EXPORT_DIR }}/windows
          mkdir -p ${{ env.EXPORT_DIR }}/linux
          mkdir -p ${{ env.EXPORT_DIR }}/macos
          mkdir -p ${{ env.EXPORT_DIR }}/web

      # ---------- 导出 ----------
      - name: Export Windows x64
        run: |
          godot --headless --path . --export-release "Windows Desktop" \
            ${{ env.EXPORT_DIR }}/windows/黎明之诗demo.exe

      - name: Export Linux x64
        run: |
          godot --headless --path . --export-release "Linux" \
            ${{ env.EXPORT_DIR }}/linux/黎明之诗demo.x86_64

      - name: Export macOS
        run: |
          godot --headless --path . --export-release "macOS" \
            ${{ env.EXPORT_DIR }}/macos/黎明之诗demo.zip

      - name: Export Web
        run: |
          godot --headless --path . --export-release "Web" \
            ${{ env.EXPORT_DIR }}/web/index.html

      # ---------- 显示体积 ----------
      - name: Show export sizes
        run: |
          echo "======= Export Sizes ======="
          du -sh ${{ env.EXPORT_DIR }}/*/* || true
          echo "----------------------------"
          ls -lh ${{ env.EXPORT_DIR }}/web/ || true

      # ---------- 上传桌面版 Artifact ----------
      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: ${{ env.EXPORT_DIR }}/windows/
          compression-level: 6

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: ${{ env.EXPORT_DIR }}/linux/
          compression-level: 6

      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ${{ env.EXPORT_DIR }}/macos/
          compression-level: 6

      # ---------- 创建 Release 并上传产物 ----------
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ env.EXPORT_DIR }}/windows/*
            ${{ env.EXPORT_DIR }}/linux/*
            ${{ env.EXPORT_DIR }}/macos/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      # ---------- 上传 Web 给 Pages 用 ----------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.EXPORT_DIR }}/web

  # ---------- 部署到 GitHub Pages ----------
  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
